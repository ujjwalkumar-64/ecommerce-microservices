spring:
  data:
    mongodb:
      username: ujjwal
      password: ujjwal
      host: localhost
      port: 27017
      database: notification
      authentication-database: admin

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentGroup,orderGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.microservice.order,com.microservice.payment
        spring.json.type.mapping: orderConfirmation:com.microservice.notification.kafka.order.OrderConfirmation,paymentNotificationRequest:com.microservice.notification.kafka.payment.PaymentConfirmation

  mail:
    host: localhost
    port: 1025
    username: ujjwal
    password: ujjwal
    properties:
      mail:
        smtp:
          trust: '*'
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

server:
  port: 8040