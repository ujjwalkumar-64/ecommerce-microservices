spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: customer-service
              uri: lb:http://CUSTOMER-SERVICE
              predicates:
                - path =/api/v1/customers/**

            - id: order-service
              uri: lb:http://ORDER-SERVICE
              predicates:
                - path =/api/v1/orders/**

            - id: order-line-service
              uri: lb:http://ORDER-SERVICE
              predicates:
                - path =/api/v1/order-lines/**

            - id: product-service
              uri: lb:http://PRODUCT-SERVICE
              predicates:
                - path =/api/v1/products/**

            - id: payment-service
              uri: lb:http://PAYMENT-SERVICE
              predicates:
                - path =/api/v1/payments

server:
  port: 8222
