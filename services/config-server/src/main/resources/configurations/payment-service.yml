spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment
    username: ujjwal
    password: ujjwal

  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: paymentNotificationRequest:com.microservice.payment.kafka.PaymentNotificationRequest

    consumer:
      bootstrap-servers: localhost:9092
      group-id: paymentRequestGroup
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.microservice.order
        spring.json.type.mapping: paymentRequest:com.microservice.payment.payment.PaymentRequest
    template:
        observation-enabled: true
    listener:
        observation-enabled: true

server:
  port: 8060